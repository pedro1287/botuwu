services:
  - type: web
    name: bot-telegram-moodle
    env: python
    region: oregon # O la región de tu preferencia
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # --- CAMBIA ESTO ---
    startCommand: python web_server.py & python main.py
    # --- HASTA AQUÍ ---
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12 # Asegúrate de que siga siendo 3.10.12 para Pyrogram
      - key: BOT_TOKEN
        sync: false

